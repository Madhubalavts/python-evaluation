<!DOCTYPE html>
<html>
<head>
<title>Simple Carousel</title>
<style>
    .carousel{
        width:600px;
        height:400px;
        margin:auto;
        overflow:hidden;
        position:relative;
        }

    .slide{
        width:100%;
        height:100%;
        position:absolute;
        display:none;
        }
</style>
</head>

<body>

<h1 style="text-align:center;">Simple Carousel</h1>

<div class="carousel" id="carousel">
  <img src="../Frontend/image 19 (1).png" class="slide">
  <img src="../Frontend/image 7.png" class="slide">
  <img src="../Frontend/Rectangle 9.png" class="slide">
</div>

<script>
    let slides = document.querySelectorAll(".slide");
    let index = 0;
    let carousel = document.getElementById("carousel");
    let interval;

function showSlide(){
for(let i=0;i<slides.length;i++){
slides[i].style.display="none";
}

slides[index].style.display="block";

index++;
if(index==slides.length){
index=0;
}
}

function start(){
interval = setInterval(showSlide,2000);
}

function stop(){
clearInterval(interval);
}

carousel.addEventListener("mouseover",stop);
carousel.addEventListener("mouseout",start);

showSlide();
start();
</script>

</body>
</html>
