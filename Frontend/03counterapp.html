<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Counter App</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.counter-box{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

#count{
font-size:50px;
font-weight:bold;
margin:20px 0;
}

#message{
font-size:18px;
font-weight:500;
margin-top:10px;
}
</style>

</head>
<body>

<div class="counter-box">
<h2>Counter App</h2>

<div id="count">0</div>

<div class="btn-group">
<button class="btn btn-danger" onclick="decrease()">-</button>
<button class="btn btn-secondary" onclick="reset()">Reset</button>
<button class="btn btn-success" onclick="increase()">+</button>
</div>

<div id="message"></div>
</div>

<script>
let count = 0;

function updateDisplay(){
document.getElementById("count").innerText = count;

let msg = "";

if(count < 0){
msg = "Low Count";
}
else if(count > 10){
msg = "High Count";
}

document.getElementById("message").innerText = msg;
}

function increase(){
count++;
updateDisplay();
}

function decrease(){
count--;
updateDisplay();
}

function reset(){
count = 0;
updateDisplay();
}
</script>

</body>
</html>
