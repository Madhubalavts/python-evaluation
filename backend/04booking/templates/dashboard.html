<!DOCTYPE html>
<html>
<head>
<title>Doctor Dashboard</title>
</head>

<body>

<h2>Doctor Appointment List</h2>

<table border="1">

<tr>
<th>ID</th>
<th>Patient</th>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Action</th>
</tr>

{% for row in data %}

<tr>

<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>{{row[4]}}</td>

<td>
<a href="/delete/{{row[0]}}">Cancel</a>
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
